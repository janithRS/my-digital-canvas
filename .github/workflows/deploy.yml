name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NITRO_PRESET: static
      - name: Copy 404 fallback
        run: |
          if [ -f dist/index.html ]; then cp dist/index.html dist/404.html; fi
          if [ -f dist/client/index.html ]; then cp dist/client/index.html dist/client/404.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ hashFiles('dist/client/index.html') != '' && 'dist/client' || 'dist' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

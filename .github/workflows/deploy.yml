name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare static output
        run: |
          OUT="dist"
          # 404 fallback so client-side routes resolve on GitHub Pages
          if [ -f "$OUT/index.html" ] && [ ! -f "$OUT/404.html" ]; then
            cp "$OUT/index.html" "$OUT/404.html"
          fi
          if [ -f public/CNAME ]; then cp public/CNAME "$OUT/CNAME"; fi
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV

          # 404 fallback so client-side routes resolve on GitHub Pages
          if [ -f "$OUT/index.html" ] && [ ! -f "$OUT/404.html" ]; then
            cp "$OUT/index.html" "$OUT/404.html"
          fi
          # CNAME for custom domain
          if [ -f public/CNAME ]; then cp public/CNAME "$OUT/CNAME"; fi
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
